# nginx site for Smart Market on a shared VPS (docker-compose.vps.yml).
# Install:  cp deploy/nginx-smartmarket.conf /etc/nginx/sites-available/smartmarket
#           ln -s /etc/nginx/sites-available/smartmarket /etc/nginx/sites-enabled/smartmarket
#           nginx -t && systemctl reload nginx
#           certbot --nginx -d <HOSTNAME> --redirect     # adds the 443 block + renewals
# Replace <HOSTNAME> with the public hostname (e.g. smartmarket.example.com).

server {
    listen 80;
    server_name <HOSTNAME>;

    client_max_body_size 12m;

    # API: the backend container listens on 127.0.0.1:5000 (host network).
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Next.js build assets are content-hashed: cache them hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else: the frontend container on 127.0.0.1:3020 (host network).
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
